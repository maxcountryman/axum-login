[package]
name = "example-web3"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
axum = "0.8.1"
askama = { version = "0.14.0" }
axum-login = { path = "../../axum-login" }
color-eyre = "0.6"
hex = "0.4"
http = "1.0.0"
rand = "0.9.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
siwe = "0.6.0"
sqlx = { version = "0.8.1", features = ["sqlite", "runtime-tokio"] }
thiserror = "2.0.0"
time = "0.3.30"
tokio = { version = "1.34.0", features = ["full"] }
tower = "0.5.2"
tower-http = { version = "0.6.0", features = ["fs", "trace"] }
tower-sessions = { version = "0.14.0", features = ["signed"] }
tower-sessions-sqlx-store = { version = "0.15.0", features = ["sqlite"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }